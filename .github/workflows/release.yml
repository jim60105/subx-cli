name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
    - uses: actions/checkout@v6
    
    - name: Extract changelog content
      id: extract_changelog
      run: |
        # Extract the latest version's changelog content
        VERSION="${{ github.ref_name }}"
        # Remove 'v' prefix if present
        VERSION_NUM="${VERSION#v}"
        
        # Find the section for this version and extract content until next version or end
        awk "/^## \[$VERSION_NUM\]/{flag=1; next} /^## \[/{if(flag) exit} flag" CHANGELOG.md > release_notes.md
        
        # If no specific version found, use a default message
        if [ ! -s release_notes.md ]; then
          echo "Release $VERSION" > release_notes.md
        fi
    
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        # Tag names containing `-` are treated as pre-releases (e.g.
        # `vX.Y.Z-rc.1`, `-beta.N`, `-alpha.N`) so `install.sh`'s
        # `releases/latest` lookup never serves an RC build as the default
        # download. Stable semver tags (`vX.Y.Z`) remain non-prerelease.
        prerelease: ${{ contains(github.ref_name, '-') }}
        body_path: release_notes.md

  build:
    name: Build and Upload
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # Native x86_64 Linux gnu — built directly with cargo on the runner.
        - os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
          binary_name: subx-cli
          asset_name: subx-linux-x86_64
          use_cross: false
        # ARM64 Linux gnu — cross-compiled via `cross` (Docker image ships the
        # gcc + glibc toolchain needed by the optional `unrar` C dependency).
        # `Cross.toml` pre-stages the ONNX Runtime archive at
        # `/opt/onnxruntime/lib`; the `Build (cross)` step exports
        # `ORT_LIB_LOCATION` so `ort-sys` skips its broken cache-based
        # download path. musl targets are intentionally NOT released:
        # upstream `ort` (Pyke) does not publish ONNX Runtime prebuilts
        # for *-unknown-linux-musl, and building ONNX Runtime from source
        # for musl is out of scope for this release pipeline.
        - os: ubuntu-latest
          target: aarch64-unknown-linux-gnu
          binary_name: subx-cli
          asset_name: subx-linux-aarch64
          use_cross: true
        - os: windows-latest
          target: x86_64-pc-windows-msvc
          binary_name: subx-cli.exe
          asset_name: subx-windows-x86_64.exe
          use_cross: false
        - os: macos-latest
          target: x86_64-apple-darwin
          binary_name: subx-cli
          asset_name: subx-macos-x86_64
          use_cross: false
        - os: macos-latest
          target: aarch64-apple-darwin
          binary_name: subx-cli
          asset_name: subx-macos-aarch64
          use_cross: false

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # Install `cross` for matrix rows that opt in. Pinned to a known-good
    # version per design.md Decision 1; bump deliberately when upstream
    # ships a regression fix.
    - name: Install cross
      if: matrix.use_cross == true
      run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked

    # Fallback path for ARM64 gnu when `cross` is unavailable. Currently
    # documented dead code — only fires when the matrix row's `use_cross`
    # is explicitly false for the aarch64-gnu target. Kept so the workflow
    # degrades gracefully if `cross` is removed in a follow-up change.
    - name: Install aarch64 gnu cross toolchain (fallback)
      if: matrix.use_cross == false && matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

    # `--features archive-rar` is required on every Linux artifact (see
    # spec: archive-rar feature parity). A failure here is a release
    # blocker — do not silently drop the feature.
    #
    # `ORT_LIB_LOCATION` points at the ONNX Runtime static archive that
    # `Cross.toml`'s `pre-build` stages inside the cross container. It
    # is harmless on non-cross builds (this step is gated on
    # `use_cross == true`).
    - name: Build (cross)
      if: matrix.use_cross == true
      env:
        ORT_LIB_LOCATION: /opt/onnxruntime/lib
      run: cross build --release --features archive-rar --target ${{ matrix.target }}

    - name: Build (cargo)
      if: matrix.use_cross == false
      run: cargo build --release --features archive-rar --target ${{ matrix.target }}

    - name: Package
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}
        else
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}
        fi

    # Smoke-test every Linux artifact before upload. x86_64 runs natively
    # on the runner; aarch64 runs under qemu-user-static. The aarch64
    # binary is dynamically linked against glibc/libstdc++/libgcc_s, so
    # qemu needs an aarch64 sysroot to resolve `ld-linux-aarch64.so.1`
    # and friends — `gcc-aarch64-linux-gnu` provides exactly that under
    # `/usr/aarch64-linux-gnu`, and `QEMU_LD_PREFIX` points qemu at it.
    # A non-zero exit, segfault, or 30s timeout fails the workflow before
    # Upload Release Asset runs (see spec: Smoke test of Linux artifacts).
    - name: Smoke test
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${{ matrix.target }}" == aarch64-* ]]; then
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support gcc-aarch64-linux-gnu
          QEMU_LD_PREFIX=/usr/aarch64-linux-gnu \
            timeout 30 qemu-aarch64-static ./${{ matrix.asset_name }} --version
        else
          timeout 30 ./${{ matrix.asset_name }} --version
        fi

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ matrix.asset_name }}

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Skip pre-release tags (e.g., vX.Y.Z-rc.1, -beta.N, -alpha.N) so RC
    # validation never publishes a pre-release version to crates.io.
    # See openspec/changes/add-arm-linux-release-targets/design.md
    # Decision 5 / Migration Plan step 1.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Publish to crates.io
      run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
