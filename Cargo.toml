# 測試用 feature flag
[features]
default = []
slow-tests = []
archive-rar = ["dep:unrar"]
[package]
name = "subx-cli"
version = "1.6.0"
edition = "2024"
authors = ["Jim Chen <Jim@ChenJ.im>"]
description = "AI subtitle processing CLI tool, which automatically matches, renames, and converts subtitle files."
license = "GPL-3.0-or-later"
repository = "https://github.com/jim60105/subx-cli"
homepage = "https://github.com/jim60105/subx-cli"
keywords = ["subtitle", "cli", "ai", "video"]
categories = ["command-line-utilities", "multimedia"]

exclude = [
    "assets/",
    ".github/",
    "tests/",
    "target/",
    "*.mp4",
    "*.mp3",
    "*.mov",
    "*.avi",
    "*.mkv",
    "plans/",
    "scripts/test_*.sh",
    "benches/",
    "**/*.log",
    "**/*.tmp",
    "**/.DS_Store",
    "Cargo.lock",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Documentation quality linting
[lints.rustdoc]
broken_intra_doc_links = "deny"
private_doc_tests = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.clippy]
missing_docs_in_private_items = "allow" # Allow missing private docs
doc_markdown = "allow"                  # Allow markdown formatting warnings

[lints.rust]
missing_docs = "allow" # Allow missing docs at rust level

[dependencies]
# CLI framework
clap = { version = "4.5.40", features = ["derive", "cargo"] }
clap_complete = "4.5.54"

# Subtitle format parsing dependencies
regex = "1.0"
encoding_rs = "0.8"

# Async runtime
tokio = { version = "1.0", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "fs",
] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"

# Configuration management
config = "0.15"

# HTTP client
reqwest = { version = "0.13", features = ["json", "stream", "rustls"] }

# File scanning
walkdir = "2.3"

# URL parsing and validation
url = "2"

# File change monitoring
notify = "8.0"

# Parallel processing support
futures = "0.3"

# Async trait support
async-trait = "0.1"
uuid = { version = "1.3", features = ["v7"] }

# Logging
log = "0.4"
env_logger = "0.11"

# User interface
colored = "3.0"
tabled = "0.20"
indicatif = "0.18"
dialoguer = "0.11"
md-5 = "0.10"

# Configuration management dependencies: path resolution and multi-core detection
# Audio processing
symphonia = { version = "0.5", default-features = false, features = [
    "isomp4",
    "mkv",
    "ogg",
    "wav",
    "aac",
    "flac",
    "mp3",
    "pcm",
    "vorbis",
] }

# VAD
tokio-util = { version = "0.7", features = ["codec"] }
hound = "3.5"
voice_activity_detector = { version = "0.2.1", features = [
    "async",
] }
rubato = "0.16.2"

# Configuration management dependencies: path resolution and multi-core detection
dirs = "6.0"
num_cpus = "1.0"

# Once Cell for runtime initialization
once_cell = "1.19"

# Archive extraction
zip = "4"
unrar = { version = "0.5", optional = true }
sevenz-rust = "0.6"
tar = "0.4"
flate2 = "1"
tempfile = "3.10"

[dev-dependencies]
# testing frameworks and utilities
tokio-test = "0.4"
assert_cmd = "2.0"
predicates = "3.0"

# mock and test case generation
mockall = "0.13"
rstest = "0.25"
test-case = "3.0"
regex = "1.10"    # For test output validation

# coverage and HTTP mocking
wiremock = "0.6"
criterion = { version = "0.6.0", features = ["html_reports"] }

# diff-friendly assertions for fixture round-trip harness
pretty_assertions = "1.4"

[[bin]]
name = "subx-cli"
path = "src/main.rs"

[[bench]]
name = "retry_performance"
harness = false

[[bench]]
name = "file_id_generation_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

# Cross-platform dependencies
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
